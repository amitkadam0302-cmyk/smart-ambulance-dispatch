name: alandi-dispatch

x-api: &api
  image: alandi-dispatch-api:local
  build:
    context: .
    dockerfile: Dockerfile.backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://dispatch:dispatch@db:5432/dispatch}
    REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

services:
  db:
    image: postgres:17.8-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch -d dispatch"]
      interval: 3s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7.4.8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
  migrate:
    <<: *api
    command: ["sh", "-c", "alembic upgrade head && python -m dispatch.manage seed-demo"]
    depends_on:
      db:
        condition: service_healthy
  api:
    <<: *api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_MAP_TILE_URL
        - VITE_MAP_ATTRIBUTION
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
