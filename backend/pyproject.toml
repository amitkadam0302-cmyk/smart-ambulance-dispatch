[project]
name = "smart-ambulance-dispatch"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.4",
  "fastapi==0.135.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.3",
  "pwdlib[argon2]==0.3.0",
  "pydantic==2.12.5",
  "PyJWT==2.12.1",
  "python-dotenv==1.2.2",
  "python-socketio==5.16.1",
  "redis==7.3.0",
  "SQLAlchemy==2.0.48",
  "uvicorn[standard]==0.42.0",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.7", "jsonschema==4.26.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
